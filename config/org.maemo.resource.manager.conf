<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">

<busconfig>

  <!-- Define the system bus service -->
  <service name="org.maemo.resource.manager">
    <user>root</user>
    <group>system</group>
  </service>

  <!-- Only root may own the service -->
  <policy user="root">
    <allow own="org.maemo.resource.manager"/>
  </policy>

  <!-- All callers may talk to the service -->
  <policy context="default">
    <allow send_destination="org.maemo.resource.manager"
           eavesdrop="true"/>
  </policy>

</busconfig>
